---
# kind tasks
# 从 kind.sigs.k8s.io 下载官方二进制安装 kind (Linux)
# 或通过 Homebrew 安装 (macOS)

- name: Check if kind is already installed (Linux)
  stat:
    path: /usr/local/bin/kind
  register: kind_installed_linux
  when: ansible_system == "Linux"

- name: Check if kind is already installed (macOS)
  command: brew list kind
  register: kind_installed_macos
  changed_when: false
  failed_when: false
  when: ansible_system == "Darwin"

- name: Detect system architecture for kind
  set_fact:
    kind_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: ansible_system == "Linux"

- name: Create cache directory (Linux)
  file:
    path: "{{ cache_dir }}/archives"
    state: directory
    mode: '0755'
  when:
    - ansible_system == "Linux"
    - not kind_installed_linux.stat.exists

- name: Download kind binary (Linux)
  get_url:
    url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-{{ kind_arch }}"
    dest: "{{ cache_dir }}/archives/kind-linux-{{ kind_arch }}"
    mode: '0644'
  environment: "{{ proxy_env }}"
  when:
    - ansible_system == "Linux"
    - not kind_installed_linux.stat.exists

- name: Install kind to binary directory (Linux)
  copy:
    src: "{{ cache_dir }}/archives/kind-linux-{{ kind_arch }}"
    dest: /usr/local/bin/kind
    mode: '0755'
    remote_src: true
  become: true
  when:
    - ansible_system == "Linux"
    - not kind_installed_linux.stat.exists

- name: Install kind via Homebrew (macOS)
  command: brew install kind
  when:
    - ansible_system == "Darwin"
    - kind_installed_macos.rc != 0

- name: Display kind installation info (Linux)
  debug:
    msg: "kind {{ kind_version }} installed at /usr/local/bin/kind"
  when:
    - ansible_system == "Linux"
    - kind_installed_linux.stat.exists

- name: Display kind installation info (macOS)
  debug:
    msg: "kind installed via Homebrew"
  when:
    - ansible_system == "Darwin"
    - kind_installed_macos.rc == 0
