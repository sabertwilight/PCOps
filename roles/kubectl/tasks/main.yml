---
# kubectl tasks
# 从 dl.k8s.io 下载官方二进制安装 kubectl (Linux)
# 或通过 Homebrew 安装 (macOS)

- name: Check if kubectl is already installed (Linux)
  stat:
    path: /usr/local/bin/kubectl
  register: kubectl_installed_linux
  when: ansible_system == "Linux"

- name: Check if kubectl is already installed (macOS)
  command: brew list kubectl
  register: kubectl_installed_macos
  changed_when: false
  failed_when: false
  when: ansible_system == "Darwin"

- name: Detect system architecture for kubectl
  set_fact:
    kubectl_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  when: ansible_system == "Linux"

- name: Create cache directory (Linux)
  file:
    path: "{{ cache_dir }}/archives"
    state: directory
    mode: '0755'
  when:
    - ansible_system == "Linux"
    - not kubectl_installed_linux.stat.exists

- name: Download kubectl binary (Linux)
  get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kubectl_arch }}/kubectl"
    dest: "{{ cache_dir }}/archives/kubectl-linux-{{ kubectl_arch }}"
    mode: '0644'
  environment: "{{ proxy_env }}"
  when:
    - ansible_system == "Linux"
    - not kubectl_installed_linux.stat.exists

- name: Install kubectl to binary directory (Linux)
  copy:
    src: "{{ cache_dir }}/archives/kubectl-linux-{{ kubectl_arch }}"
    dest: /usr/local/bin/kubectl
    mode: '0755'
    remote_src: true
  become: true
  when:
    - ansible_system == "Linux"
    - not kubectl_installed_linux.stat.exists

- name: Install kubectl via Homebrew (macOS)
  command: brew install kubectl
  when:
    - ansible_system == "Darwin"
    - kubectl_installed_macos.rc != 0

- name: Display kubectl installation info (Linux)
  debug:
    msg: "kubectl {{ kubectl_version }} installed at /usr/local/bin/kubectl"
  when:
    - ansible_system == "Linux"
    - kubectl_installed_linux.stat.exists

- name: Display kubectl installation info (macOS)
  debug:
    msg: "kubectl installed via Homebrew"
  when:
    - ansible_system == "Darwin"
    - kubectl_installed_macos.rc == 0
