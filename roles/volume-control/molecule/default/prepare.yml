---
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Create dummy wireplumber binary
      ansible.builtin.file:
        path: /usr/bin/wireplumber
        state: touch
        mode: "0755"
